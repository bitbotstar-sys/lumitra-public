<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Travel Japan | LUMITRA</title><meta name="description" content="Plan family-friendly trips to Japan: attractions, rainy-day options and hotel conditions."><link rel="canonical" href="https://bitbotstar-sys.github.io/lumitra-public/family-japan.html"><style>body{margin:0;background:#f5f8fb;color:#17304b;font:16px/1.7 system-ui,sans-serif}header{background:#14334f;color:white;padding:20px}header a{color:white;text-decoration:none;font-weight:800}main{max-width:900px;margin:auto;padding:30px 18px}h1{font-size:clamp(30px,5vw,52px);line-height:1.2}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 16px #102a4314}.links{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.links a{background:#165f88;color:white;padding:12px 16px;border-radius:12px;text-decoration:none}select{padding:9px;border-radius:10px;font-size:16px}footer{color:#60768b;font-size:14px;margin-top:30px}</style></head><body><header><a href="./index.html?lang=ja">LUMITRA</a>　<select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option><option value="fr">Français</option><option value="es">Español</option><option value="th">ภาษาไทย</option></select></header><main><h1 id="title"></h1><p id="intro"></p><div class="cards"><section class="card"><h2 id="h1"></h2><p id="p1"></p></section><section class="card"><h2 id="h2"></h2><p id="p2"></p></section><section class="card"><h2 id="h3"></h2><p id="p3"></p></section></div><nav class="links"><a id="planner" href="./global.html?lang=en"></a><a id="guide" href="./japan-guide.html"></a></nav><footer id="note"></footer></main><script>(function(){const d={"ja":["子連れで楽しむ日本旅行","家族旅行を、無理なく楽しく。","年齢に合う観光地","移動時間と休憩を考え、1日に予定を詰め込みすぎないようにしましょう。","雨の日の代替案","屋内施設や博物館を候補にして、天候に応じて変更しましょう。","家族向けの宿","添い寝・子ども料金・食事・ベビーベッドの条件を予約前に確認しましょう。","旅行プランを作る","日本のマナーを見る","掲載情報は旅行計画の参考です。営業時間・料金・空室は施設の公式情報でご確認ください。"],"en":["Family Travel Japan","Explore Japan with kids, at a comfortable pace.","Age-friendly attractions","Allow time for travel and breaks; avoid overpacking each day.","Rainy-day alternatives","Keep museums and indoor attractions as backup options.","Family-friendly stays","Check child rates, bedding, meals and crib availability before booking.","Plan a trip","Japan etiquette guide","Planning guidance only. Confirm hours, prices and availability with providers."],"zh":["日本亲子旅行","和孩子一起轻松探索日本。","适合孩子的景点","预留交通和休息时间，不要把每天的行程排得太满。","雨天备选方案","准备博物馆及室内景点，以便根据天气调整。","亲子住宿","预订前确认儿童费用、床铺、餐食和婴儿床。","规划旅行","日本礼仪指南","仅供旅行规划参考。请向服务商确认营业时间、价格和空房情况。"],"zh-TW":["日本親子旅行","帶著孩子輕鬆探索日本。","適合孩子的景點","預留交通與休息時間，避免每天安排過多行程。","雨天備案","事先準備博物館與室內景點。","親子住宿","預訂前確認兒童費用、寢具、餐食及嬰兒床。","規劃旅行","日本禮儀指南","僅供規劃參考。營業時間、價格與空房請向業者確認。"],"ko":["일본 가족 여행","아이들과 여유롭게 일본을 여행하세요.","아이에게 맞는 관광지","이동과 휴식 시간을 확보하고 일정을 너무 빡빡하게 잡지 마세요.","비 오는 날 대안","박물관과 실내 명소를 미리 준비하세요.","가족 친화 숙소","예약 전 아동 요금, 침구, 식사, 아기 침대를 확인하세요.","여행 계획하기","일본 예절 가이드","여행 계획 참고용입니다. 영업시간, 가격, 객실은 업체에 확인하세요."],"fr":["Voyager au Japon en famille","Découvrez le Japon avec vos enfants, à votre rythme.","Activités adaptées aux enfants","Prévoyez des pauses et évitez les journées trop chargées.","Solutions en cas de pluie","Prévoyez des musées et des activités en intérieur.","Hébergements familiaux","Vérifiez les tarifs enfants, les lits, les repas et les berceaux avant de réserver.","Planifier un voyage","Guide des bonnes manières","Informations indicatives. Vérifiez horaires, prix et disponibilités auprès des prestataires."],"es":["Viajar a Japón en familia","Descubre Japón con niños, a un ritmo cómodo.","Atracciones para niños","Deja tiempo para traslados y descansos; evita itinerarios recargados.","Alternativas para días lluviosos","Ten preparados museos y lugares cubiertos.","Alojamiento familiar","Comprueba tarifas infantiles, camas, comidas y cunas antes de reservar.","Planificar un viaje","Guía de modales en Japón","Información orientativa. Confirma horarios, precios y disponibilidad con los proveedores."],"th":["เที่ยวญี่ปุ่นกับครอบครัว","เที่ยวญี่ปุ่นกับเด็ก ๆ อย่างสบายใจและไม่เร่งรีบ","สถานที่เหมาะกับเด็ก","เผื่อเวลาเดินทางและพักผ่อน อย่าจัดกิจกรรมแน่นเกินไป","แผนสำรองวันฝนตก","เตรียมพิพิธภัณฑ์และสถานที่ในร่มไว้เป็นทางเลือก","ที่พักสำหรับครอบครัว","ตรวจสอบราคาเด็ก เตียง อาหาร และเตียงเด็กก่อนจอง","วางแผนทริป","คู่มือมารยาทญี่ปุ่น","ข้อมูลสำหรับวางแผนเท่านั้น โปรดยืนยันเวลาเปิด ราคา และห้องว่างกับผู้ให้บริการ"]};const select=document.getElementById('lang');const q=new URLSearchParams(location.search).get('lang');let lang=q;try{if(!lang)lang=localStorage.getItem('lumitra-language')}catch(e){}if(!d[lang])lang='en';function show(l){lang=l;const a=d[l];document.documentElement.lang=l;select.value=l;['title','intro','h1','p1','h2','p2','h3','p3','planner','guide','note'].forEach((id,i)=>document.getElementById(id).textContent=a[i]);document.getElementById('planner').href=l==='ja'?'./index.html?lang=ja':'./global.html?lang='+encodeURIComponent(l);document.getElementById('guide').href='./japan-guide.html?lang='+encodeURIComponent(l);try{localStorage.setItem('lumitra-language',l)}catch(e){}}select.addEventListener('change',()=>{show(select.value);history.replaceState(null,'','?lang='+encodeURIComponent(select.value))});show(lang)})();</script></body></html>
