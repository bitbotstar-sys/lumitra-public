<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Japan Etiquette | LUMITRA</title><link rel="canonical" href="https://bitbotstar-sys.github.io/lumitra-public/japan-guide-global.html"><style>body{margin:0;background:#f7f9fc;color:#19344d;font:16px/1.7 system-ui,sans-serif}header{padding:18px;background:#12344f;color:white}header a{color:white;font-weight:bold}select{padding:9px;border-radius:9px;font-size:16px}main{max-width:980px;margin:auto;padding:26px 18px}h1{font-size:clamp(28px,5vw,48px)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 3px 14px #19344d15}.links{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.links a{background:#165f88;color:white;padding:11px 16px;border-radius:10px;text-decoration:none}footer{color:#667}</style></head><body><header><a href="./">LUMITRA</a>　<select id="lang" aria-label="Language"><option value="ja">日本語</option><option value="en">English</option><option value="zh">简体中文</option><option value="zh-TW">繁體中文</option><option value="ko">한국어</option><option value="fr">Français</option><option value="es">Español</option><option value="th">ภาษาไทย</option></select></header><main><h1 id="title"></h1><p id="intro"></p><div class="grid" id="cards"></div><nav class="links"><a id="back"></a><a href="./japan-guide.html" id="full"></a></nav><footer id="note"></footer></main><script>(function(){const d={"ja":["日本のマナー・文化ガイド","日本で気持ちよく旅するための基本","挨拶","こんにちは・ありがとうございます・すみませんを使いましょう。","電車・バス","静かに会話し、乗車前に降りる人を優先しましょう。","温泉","入浴前に体を洗い、タオルを湯船に入れないでください。","神社・お寺","掲示された撮影ルールを守り、参拝する人の邪魔をしないようにしましょう。","食事","お店ごとの注文方法を確認し、食物アレルギーは事前に伝えましょう。","緊急時","警察110、消防・救急119。困ったときは宿泊施設にも相談できます。","旅行プランへ戻る","詳しい英語版ガイド","地域・施設ごとにルールが異なる場合があります。現地の案内を優先してください。"],"en":["Japan Manners & Culture","Simple tips for a respectful, enjoyable trip","Greetings","Try konnichiwa (hello), arigatō (thank you) and sumimasen (excuse me).","Trains & buses","Keep conversations quiet and let passengers exit before boarding.","Onsen baths","Wash before entering and keep towels out of the bath water.","Shrines & temples","Follow photography signs and respect people who are worshipping.","Dining","Check ordering customs and tell staff about allergies before ordering.","Emergencies","Police: 110. Fire and ambulance: 119. Your accommodation may also help.","Back to trip planner","Full English guide","Rules vary by place and facility. Follow local signs and staff guidance."],"zh":["日本礼仪与文化","轻松了解日本旅行的基本礼仪","问候","可以说“こんにちは”（你好）、“ありがとう”（谢谢）、“すみません”（不好意思）。","电车与巴士","保持轻声交谈，先下后上。","温泉","入浴前先清洗身体，毛巾不要放入浴池。","神社与寺庙","遵守摄影规定，尊重参拜者。","用餐","确认点餐方式，提前告知食物过敏情况。","紧急情况","报警110，消防及急救119，也可向住宿设施求助。","返回旅行规划","完整英文指南","各地及设施规定可能不同，请遵循现场指示。"],"zh-TW":["日本禮儀與文化","輕鬆了解日本旅遊的基本禮儀","問候","可以說「こんにちは」（你好）、「ありがとう」（謝謝）、「すみません」（不好意思）。","電車與巴士","輕聲交談，先下後上。","溫泉","入浴前先洗淨身體，毛巾不要放進浴池。","神社與寺廟","遵守攝影規定，尊重參拜者。","用餐","確認點餐方式，事先告知食物過敏情況。","緊急情況","報警110，消防及救護119，也可向住宿設施求助。","返回旅遊規劃","完整英文指南","各地及設施規定可能不同，請遵循現場指示。"],"ko":["일본 예절과 문화","즐거운 일본 여행을 위한 기본 예절","인사","곤니치와(안녕하세요), 아리가토(감사합니다), 스미마센(실례합니다)을 사용해 보세요.","전철과 버스","조용히 대화하고 내리는 승객을 먼저 보내세요.","온천","탕에 들어가기 전에 몸을 씻고 수건은 탕에 넣지 마세요.","신사와 절","사진 촬영 규칙을 지키고 참배객을 배려하세요.","식사","주문 방식을 확인하고 알레르기는 미리 알려 주세요.","긴급 상황","경찰 110, 소방·구급 119. 숙소에서도 도움을 받을 수 있습니다.","여행 계획으로","자세한 영어 가이드","장소마다 규칙이 다를 수 있으니 현장 안내를 따르세요."],"fr":["Savoir-vivre au Japon","Quelques conseils pour voyager avec respect","Salutations","Essayez konnichiwa (bonjour), arigatō (merci) et sumimasen (excusez-moi).","Trains et bus","Parlez doucement et laissez descendre les passagers avant de monter.","Onsen","Lavez-vous avant le bain et ne plongez pas les serviettes dans l'eau.","Sanctuaires et temples","Respectez les consignes photo et les personnes en prière.","Restaurants","Vérifiez comment commander et signalez vos allergies alimentaires.","Urgences","Police : 110. Pompiers et ambulance : 119. Votre hébergement peut aussi aider.","Retour au voyage","Guide anglais détaillé","Les règles varient selon les lieux. Suivez les indications locales."],"es":["Modales y cultura de Japón","Consejos sencillos para viajar con respeto","Saludos","Prueba konnichiwa (hola), arigatō (gracias) y sumimasen (disculpa).","Trenes y autobuses","Habla en voz baja y deja salir antes de subir.","Baños onsen","Lávate antes de entrar y no metas toallas en el agua.","Santuarios y templos","Respeta las normas de fotografía y a quienes están rezando.","Restaurantes","Comprueba cómo pedir y avisa de tus alergias alimentarias.","Emergencias","Policía: 110. Bomberos y ambulancias: 119. Tu alojamiento también puede ayudarte.","Volver al planificador","Guía completa en inglés","Las normas varían según el lugar. Sigue las indicaciones locales."],"th":["มารยาทและวัฒนธรรมญี่ปุ่น","เคล็ดลับง่าย ๆ สำหรับการเที่ยวญี่ปุ่นอย่างเคารพวัฒนธรรม","คำทักทาย","ลองพูด คนนิจิวะ (สวัสดี) อาริกาโต (ขอบคุณ) และสุมิมาเซ็น (ขอโทษ)","รถไฟและรถบัส","พูดคุยเบา ๆ และให้ผู้โดยสารลงก่อนขึ้น","ออนเซ็น","ล้างตัวก่อนลงแช่น้ำ และอย่านำผ้าขนหนูลงในบ่อ","ศาลเจ้าและวัด","ปฏิบัติตามกฎการถ่ายภาพและเคารพผู้มาสักการะ","ร้านอาหาร","ตรวจสอบวิธีสั่งอาหารและแจ้งอาการแพ้อาหารล่วงหน้า","เหตุฉุกเฉิน","ตำรวจ 110 ดับเพลิงและรถพยาบาล 119 ที่พักอาจช่วยเหลือได้","กลับไปวางแผนเที่ยว","คู่มือฉบับเต็มภาษาอังกฤษ","กฎอาจแตกต่างกันในแต่ละสถานที่ โปรดทำตามคำแนะนำในพื้นที่"]};const select=document.getElementById('lang');let lang=new URLSearchParams(location.search).get('lang');try{if(!lang)lang=localStorage.getItem('lumitra-language')}catch(e){}if(!d[lang])lang='en';function show(l){lang=l;const a=d[l];document.documentElement.lang=l;select.value=l;document.getElementById('title').textContent=a[0];document.getElementById('intro').textContent=a[1];const root=document.getElementById('cards');root.replaceChildren();for(let i=2;i<14;i+=2){const section=document.createElement('section');section.className='card';const h=document.createElement('h2');h.textContent=a[i];const p=document.createElement('p');p.textContent=a[i+1];section.append(h,p);root.append(section)}const back=document.getElementById('back');back.textContent=a[14];back.href=l==='ja'?'./index.html?lang=ja':'./global.html?lang='+encodeURIComponent(l);document.getElementById('full').textContent=a[15];document.getElementById('note').textContent=a[16];try{localStorage.setItem('lumitra-language',l)}catch(e){}}select.addEventListener('change',()=>{show(select.value);history.replaceState(null,'','?lang='+encodeURIComponent(select.value))});show(lang)})();</script></body></html>
